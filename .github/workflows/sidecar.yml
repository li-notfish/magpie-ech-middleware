name: sidecar

# The repository carries no binaries, so that it stays small: one per
# platform is published as an asset of the sidecar release instead, and a
# machine that installs the package downloads the one of its own, needing
# no Go at all. This workflow is how the assets are made: one Go build per
# platform, into dist/<platform>-<arch>/, and an upload of them all to the
# release.

on:
  push:
    branches: [main]
    paths:
      - "sidecar/**"
      - "scripts/**"
      - ".github/workflows/sidecar.yml"
  pull_request:
    paths:
      - "sidecar/**"
      - "scripts/**"
      - "*.js"
      - "*.mjs"
      - "package.json"
      - ".github/workflows/sidecar.yml"
  workflow_dispatch:

# two pushes must not write the same release's assets at once
concurrency:
  group: sidecar-release
  cancel-in-progress: false

permissions:
  # the assets of the sidecar release are written, the repository is not
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - name: build the sidecar for every platform
        run: node scripts/build-all.mjs

      - name: test the sidecar
        run: go test ./...
        working-directory: sidecar

      - name: test
        run: bun test

      - name: say what was built
        run: sha256sum dist/*/ech-sidecar-* | tee -a "$GITHUB_STEP_SUMMARY"

      - name: publish the binaries as the release's assets
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sidecar
          body: |
            Built from `${{ github.sha }}` by [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          files: dist/**/ech-sidecar-*
          fail_on_unmatched_files: true
